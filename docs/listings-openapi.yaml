openapi: 3.0.3
info:
  title: Property 973 — Owner Listings API
  version: 1.0.0
  description: REST APIs for owner property listings (Bahrain real estate platform).
servers:
  - url: http://localhost:4000
    description: Local development
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiError:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
    ListingPhoto:
      type: object
      properties:
        id:
          type: string
        url:
          type: string
        order:
          type: integer
        createdAt:
          type: string
          format: date-time
    PropertyListing:
      type: object
      properties:
        id:
          type: string
        ownerId:
          type: integer
        listingKind:
          type: string
          enum: [licensed, marketing]
        purpose:
          type: string
          enum: [rent, sale]
        propertyType:
          type: string
        city:
          type: string
        district:
          type: string
        price:
          type: number
        area:
          type: number
        description:
          type: string
        contactPhone:
          type: string
        status:
          type: string
          enum: [draft, active, inactive, deleted]
        photos:
          type: array
          items:
            $ref: '#/components/schemas/ListingPhoto'
paths:
  /listings:
    post:
      summary: Create listing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropertyListing'
          multipart/form-data:
            schema:
              type: object
              properties:
                photos:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '201':
          description: Created
        '401':
          description: Unauthorized
        '422':
          description: Validation failed
    get:
      summary: List my listings
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
        - in: query
          name: purpose
          schema:
            type: string
            enum: [rent, sale]
        - in: query
          name: status
          schema:
            type: string
            enum: [active, inactive, draft]
        - in: query
          name: sort
          schema:
            type: string
            default: '-createdAt'
      responses:
        '200':
          description: Paginated listings
  /listings/{id}:
    get:
      summary: Get listing by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Listing detail
        '403':
          description: Forbidden
        '404':
          description: Not found
    patch:
      summary: Update listing (partial)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Updated
    delete:
      summary: Soft-delete listing
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
  /listings/{id}/photos:
    post:
      summary: Upload photos
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                photos:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '200':
          description: Photos uploaded
        '413':
          description: Photo too large
        '415':
          description: Unsupported image type
  /listings/{id}/photos/{photoId}:
    delete:
      summary: Delete one photo
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: photoId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Photo deleted
